  "review_findings": [
    {
      "id": "F1",
      "label": "F1: one adiabatic index used for two physical roles",
      "status": "resolved",
      "requirement_ids": [],
      "resolution": "Separate `gamma_w`, `gamma_ad`, and `gamma_c` govern the effective wind, rapid MHD response/shock EOS, and optional closed-plasma polytrope (Sections 2, 4, 5, and 9)."
    },
    {
      "id": "F2",
      "label": "F2: no authoritative closed-field upstream state",
      "status": "resolved",
      "requirement_ids": [],
      "resolution": "A composition-aware gravity-plus-centrifugal hydrostatic provider owns every closed-field plasma query; separatrix quadrature is one-sided (Section 4)."
    },
    {
      "id": "F3",
      "label": "F3: zero-field HCS and unrealistic latitude structure",
      "status": "resolved",
      "requirement_ids": [],
      "resolution": "A finite-shell, nonnegative-qualified SCS solution restores discrete polarity and supplies a one-sided HCS; a separately normalized plasma sheet is optional (Section 6)."
    },
    {
      "id": "F4",
      "label": "F4: nearly uniform polytropic wind",
      "status": "resolved",
      "requirement_ids": ["SCCM-R2-WIND-BOUNDS"],
      "resolution": "A target-speed polytrope remains a D7-qualified sensitivity branch. The recommended event branch combines versioned inner-density and outer-velocity/temperature products through one resolution-invariant mass-loading authority and reports compatibility, coverage, and momentum residuals (Sections 5, 13, and 17)."
    },
    {
      "id": "F5",
      "label": "F5: missing longitude-map Jacobian",
      "status": "resolved",
      "requirement_ids": [],
      "resolution": "The outer map advances the forward/inverse Jacobian, preserves magnetic flux, and fails on characteristic folding (Section 6)."
    },
    {
      "id": "F6",
      "label": "F6: forced initial shock",
      "status": "resolved",
      "requirement_ids": [],
      "resolution": "The candidate front may initialize entirely sub-fast; shock and source activation are local, delayed, and time-rooted (Sections 9 and 14)."
    },
    {
      "id": "F7",
      "label": "F7: under-specified front geometry",
      "status": "resolved",
      "requirement_ids": [],
      "resolution": "Center translation and three semiaxes have independent histories; direction and tilt are explicit but fixed in schema 5, and apex state is derived (Section 8)."
    },
    {
      "id": "S1--S7",
      "label": "S1--S7: criticality, switch-on, PFSS truncation, scattering, source end, zero-source status, and rotation/provenance",
      "status": "resolved",
      "requirement_ids": [],
      "resolution": "Bounded critical-Mach tables and near-parallel branches, qualified spectral filtering, broken-MFP/collision models, smooth latched termination, non-lossy root/line status, and explicit frame/rotation metadata are specified in Sections 2, 4, 6--11, and 13--17."
    },
    {
      "id": "R1",
      "label": "R1: a thin SCS shell may leave the latitude structure unchanged",
      "status": "resolved",
      "requirement_ids": ["SCCM-R1-SCS-RADIALIZATION"],
      "resolution": "Finite-shell attenuation is evaluated analytically and numerically; all-mode attenuation remains diagnostic, while production must pass the absolute outer zonal-power and longitude-averaged latitude-flatness gates. `R_scs=2.5 R_sun` has no automatic exemption (Sections 6, 14, and 17)."
    },
    {
      "id": "R2",
      "label": "R2: target-speed polytropes can produce unrealistic density or mass flux",
      "status": "resolved",
      "requirement_ids": ["SCCM-R2-WIND-BOUNDS"],
      "resolution": "`tube-from-target-speed` is a qualified sensitivity branch. The event branch combines an inner observed-density zone with an outer observed-velocity zone, derives velocity everywhere from one independently constrained mass-per-flux authority, and publishes overlap, momentum-residual, density, and mass-flux diagnostics (Sections 5, 13, 14, and 17)."
    },
    {
      "id": "R3",
      "label": "R3: no absolute open-flux calibration",
      "status": "resolved",
      "requirement_ids": ["SCCM-R3-OPEN-FLUX"],
      "resolution": "A same-rotation in-situ open-flux comparison, nested-sphere closure test, optional one-time magnetogram scaling from a construction-role asset, and a disjoint qualification-role D6 product are mandatory for event work. One observation or covariance partition cannot both determine the scale and qualify/weight its candidate (Sections 4, 13, 14, and 17)."
    },
    {
      "id": "R4",
      "label": "R4: the SCS HCS is not automatically a flux surface of the PFSS/SCS transition",
      "status": "resolved",
      "requirement_ids": ["SCCM-R4-TRANSITION-TOPOLOGY"],
      "resolution": "The transition distinguishes solenoidality from topology. Its signed-field vector potential and gauge are specified, and schema-5 production excludes a convergence-qualified transition-sheet band from source, transport, observers, and export; a constructed common flux surface remains a future capability (Sections 6, 11--14, and 17)."
    },
    {
      "id": "R5",
      "label": "R5: an arbitrary separatrix pressure jump violates a stationary tangential-interface interpretation",
      "status": "resolved",
      "requirement_ids": ["SCCM-R5-SEPARATRIX-STRESS"],
      "resolution": "The interface contract now distinguishes a diagnostic kinematic construction, a bounded event approximation, and a true stationary tangential-discontinuity state. All retain hard topology/kinematic gates; sharp interfaces gate the mass-flux jump and report the full vector MHD traction jump, whereas smooth transitions report a volume momentum residual. Pointwise values, quantiles, and maxima are retained, and a global mean can never establish balance (Sections 4, 14, and 17)."
    },
    {
      "id": "R6",
      "label": "R6: `p_w/p` is not the omitted wave-force error",
      "status": "resolved",
      "requirement_ids": ["SCCM-R6-WAVE-FORCE"],
      "resolution": "Wave/thermal and `delta B/B` ratios remain diagnostics, while the normative uncoupled-wind gate uses the wave-pressure-gradient acceleration relative to retained momentum terms and remains closure specific (Sections 7, 14, and 17)."
    },
    {
      "id": "R7",
      "label": "R7: one critical-Mach table miss can abort an otherwise diagnostic calculation",
      "status": "resolved",
      "requirement_ids": ["SCCM-R7-CRITICAL-COVERAGE"],
      "resolution": "EOS/convention mismatch remains fatal. Domain misses use an explicit policy: diagnostic inapplicability for a fast-only source, or preflight failure/budgeted source exclusion when criticality controls injection (Sections 9, 14, and 17)."
    },
    {
      "id": "R8",
      "label": "R8: two configuration sections own the same rotation rate",
      "status": "resolved",
      "requirement_ids": ["SCCM-R8-ROTATION-AUTHORITY"],
      "resolution": "`[solar_rotation]` is the sole physical authority; closed plasma, mapping, observers, and field-line export consume its resolved sidereal value read-only (Sections 2 and 14)."
    },
    {
      "id": "R9",
      "label": "R9: moving-source normalization does not say which population is represented",
      "status": "resolved",
      "requirement_ids": ["SCCM-R9-RELEASE-SEMANTICS"],
      "resolution": "`eta*g(p)` is explicitly the empirical **net first-passage flux through a finite physical upstream reference surface**, not gross shock emission or the total downstream DSA population. A front conormal-flux/no-through-flow boundary is a named sensitivity branch, while the former shock-adjacent absorbing construction is verification-only because its surviving population vanishes with placement distance (Sections 10, 14, and 17)."
    },
    {
      "id": "R10",
      "label": "R10: a monolithic specification risks cross-section drift",
      "status": "resolved",
      "requirement_ids": ["SCCM-R10-DOC-AUTHORITY"],
      "resolution": "The canonical document is generated deterministically from four nonoverlapping physics, configuration/validation, architecture/exchange, and testing/validation modules. Stable requirement records own the review-disposition, schema/API/test trace, and document links. R10 is satisfied only when the checked-in registry, generator, and generation test exist and pass; this prose alone cannot satisfy it (Sections 15--17)."
    },
    {
      "id": "N1",
      "label": "N1: an absorbing shock plus a placement layer sent to zero makes release mover- and resolution-dependent",
      "status": "resolved",
      "requirement_ids": ["SCCM-R9-RELEASE-SEMANTICS", "SCCM-N1-SOURCE-BOUNDARY"],
      "resolution": "Event production now uses a finite physical upstream net-first-passage reference surface whose distance is held fixed during placement/mesh convergence. Focused release uses sign-certified root partitioning and error-controlled positive-normal-flux quadrature whose numerical tolerances never redefine exact Z=0, explicit tangent-field handling, upstream-only placement, and typed no-escape versus unresolved-numerics states. DelayedFrontReturn is the sole post-reference front-return ledger, and NetFirstPassageRelease remains distinct from time-dependent SurvivingUpstreamInventory; Parker conormal/no-through-flow is sensitivity-only, and gross shock-adjacent emission is verification-only (Sections 10, 14, 15, and 17)."
    },
    {
      "id": "N2",
      "label": "N2: a speed-only empirical wind cannot determine low-coronal density or mass loading",
      "status": "resolved",
      "requirement_ids": ["SCCM-R2-WIND-BOUNDS", "SCCM-N2-TWO-ZONE-WIND"],
      "resolution": "The event branch now uses independently coordinated and supported observed inner-density, outer-velocity, and species-temperature channels in a checksummed manifest, exact certified quintic-Hermite C2 interpolation, and one independently supported eta_m; it includes composition/charge-state conversion, covariance-aware mismatch gates, distinct data-use roles, and physical-measure D7 coverage (Sections 5, 13, 14, 16, and 17)."
    },
    {
      "id": "N3",
      "label": "N3: independent open/closed closures cannot generally satisfy a universal stationary tangential-discontinuity gate",
      "status": "resolved",
      "requirement_ids": ["SCCM-R5-SEPARATRIX-STRESS", "SCCM-N3-INTERFACE-BALANCE"],
      "resolution": "The interface now has three typed open/closed policies and diagnostic/bounded generic open/open policies. Hard normal-field and interface-relative normal-flow gates apply to the open/closed tangential separatrix and are typed not applicable for generic open/open or plasma-sheet structure; sharp interfaces gate mass-flux jump and use the full vector MHD traction jump, while smooth open/closed, open/open, or plasma-sheet transitions use a volume momentum residual. Fitted normalizations are sensitivities, not equilibrium solvers (Sections 4, 6, 14, 16, and 17)."
    },
    {
      "id": "N4",
      "label": "N4: transition-clearance and absorbing-front losses had no acceptance caps",
      "status": "resolved",
      "requirement_ids": ["SCCM-N4-CONSUMER-BUDGETS"],
      "resolution": "Preregistered consumer budgets now cap otherwise-source-eligible area, counterfactual number/energy source rate, finite-footprint magnetic flux, represented runtime number loss, and lost birth-energy fraction with explicit denominators. Event-time energy/momentum impact remains an unbounded dimensional diagnostic. Zero caps are legal; point observers use typed valid/rejected states, and front-loss caps activate only for a removing boundary policy (Sections 6, 10, 14, 16, and 17)."
    },
    {
      "id": "N5",
      "label": "N5: open-flux scaling and source-surface radii were not jointly discriminated with shock-formation constraints",
      "status": "resolved",
      "requirement_ids": ["SCCM-R3-OPEN-FLUX", "SCCM-N5-JOINT-CALIBRATION"],
      "resolution": "Campaign C now evaluates the full preregistered magnetogram/scale/radius/wind/front candidate product against independent-qualification D6, coronal topology, D1, D2, and a density-conditioned event-specific type-II/EUV likelihood, never SEP output. Construction, qualification, and withheld roles remain separate; pre-inferred heights carry their density-model covariance. Radius changes rebuild both topology and field magnitude (Sections 9, 13, 14, and 17)."
    },
    {
      "id": "N6",
      "label": "N6: radial velocity can be misapplied to nonradial or field-aligned profile coordinates",
      "status": "resolved",
      "requirement_ids": ["SCCM-N6-PROFILE-COORDINATES"],
      "resolution": "Each checksummed profile channel independently declares velocity component/reference frame, a channel-local radial-projection guard, deterministic disjoint consumer selector, radius/arc-length abscissa, spatial frame/epoch/origin, support, line IDs, background fingerprint, provenance, role, and covariance. Radius support is split where r(s) is nonmonotone; D7 retains stable rejected tube/line IDs and reasons, and missing required consumer support is fatal for event-nominal use (Sections 5, 13--17)."
    },
    {
      "id": "N7",
      "label": "N7: the canonical specification was described as generated but had no generator or maintained modules",
      "status": "resolved",
      "requirement_ids": ["SCCM-R10-DOC-AUTHORITY", "SCCM-N7-GENERATED-SPEC"],
      "resolution": "The shared model now has four nonoverlapping maintained modules, a structured requirement/review registry, a deterministic generator, and executable byte-identity and negative validation tests under the model-neutral `DOCSCCM01` gate (Sections 15--17)."
    },
    {
      "id": "P1",
      "label": "P1: the finite reference distance lacks an inference rule and delayed returns are removed",
      "status": "documented",
      "requirement_ids": ["SCCM-N1-SOURCE-BOUNDARY", "SCCM-P1-REFERENCE-SURFACE-DIAGNOSTIC"],
      "resolution": "The fixed finite distance remains the schema-5 baseline and must be bound to its calibration, coefficient, mean-free-path, selected-mover, return-policy, frame, support, and exact calibration-horizon fingerprints. D10 gains the integrated release-depth Péclet diagnostic `integral(u_1n^in/kappa_nn,dd)` and finite-horizon no-front-return accounting; `P<1` means inside one constant-planar diffusion length and is not a return probability. A momentum-dependent fixed-Péclet surface is a nonseparable future source-family capability, and simple re-emission or redrawing from `g(p)` is rejected because physical renewal requires residence, downstream-transfer, pitch/momentum, and shock-work closure (Sections 10, 14--17)."
    },
    {
      "id": "P2",
      "label": "P2: shock-generated turbulence is absent from post-reference scattering",
      "status": "documented",
      "requirement_ids": ["SCCM-P2-SELF-GENERATED-WAVES"],
      "resolution": "The omission is correct and is now explicit. Schema 5 retains prescribed/WKB turbulence or direct mean free paths and must not advertise a nonexistent `srcSEP` self-excited-wave solver. A versioned empirical foreshock scattering proxy is future sensitivity-only; a physical self-generated-wave branch instead requires a coupled spectral wave equation, growth/damping/cascade, wave-to-scattering closure, particle-wave conservation, and wind coupling whenever wave forces or heating cease to be negligible. Campaigns D/E own a separate complete, non-release streaming-limit evidence record; agreement cannot promote an ambient or empirical-proxy branch into a coupled-wave model (Sections 7, 10, 11, and 14--17)."
    },
    {
      "id": "P3",
      "label": "P3: gradient and curvature drift are absent from the three-dimensional movers",
      "status": "documented",
      "requirement_ids": ["SCCM-P3-GUIDING-CENTER-DRIFT"],
      "resolution": "The omission is real, but a drift velocity and an extra `q E dot v_d` term cannot be appended independently to the present focused mover without risking double-counted energy evolution. Schema 5 keeps drift disabled. A future ordered operator must evolve position and energy coherently, demonstrate guiding-center validity, guard weak-field/separatrix regions, treat finite-thickness HCS drift separately, recover the no-drift result, and compare with full-orbit trajectories before drift-sensitive perpendicular-diffusion inference (Sections 11, 12, and 14--17)."
    },
    {
      "id": "P4",
      "label": "P4: the CME front cannot dynamically deflect or rotate",
      "status": "documented",
      "requirement_ids": ["SCCM-P4-DYNAMIC-CME-TRAJECTORY"],
      "resolution": "Schema 5 retains a fixed propagation direction and attitude, while the sensitivity campaign uses event-reconstruction covariance rather than a universal angle scan. A future capability must represent nonradial center translation and smooth SO(3) attitude as independent histories, derive center velocity and angular velocity analytically, and include both terms in front normal speed; componentwise quaternion interpolation is forbidden (Sections 8 and 14--17)."
    },
    {
      "id": "P5",
      "label": "P5: SEP transport validation relies on one event",
      "status": "documented",
      "requirement_ids": ["SCCM-P5-INDEPENDENT-EVENT"],
      "resolution": "The validation plan now requires an out-of-sample event with the equations, inference procedure, and parameters claimed transferable frozen while event-specific magnetic, wind, front, and observer inputs are prepared independently. The 2012 May 17 GLE is classified as a difficult stress test unless its pre-existing magnetic-cloud connectivity is represented; failure is reported as a model-form or transferability finding rather than tuned away (Sections 13, 16, and 17)."
    },
    {
      "id": "P6",
      "label": "P6: the analytic background has no matched MHD structural comparison",
      "status": "documented",
      "requirement_ids": ["SCCM-P6-MHD-STRUCTURAL-BENCHMARK"],
      "resolution": "A matched offline benchmark now evaluates identical event support and the identical prescribed front on analytic and external thermodynamic-MHD samples, comparing density, temperature, pressure, vector magnetic field and velocity, characteristic speeds, topology/connectivity, fast-Mach number, obliquity, and activation products. It is explicitly an inter-model structural-uncertainty comparison, never observational truth, a tuning asset, or evidence that a runtime imported-MHD provider exists; that provider/bundle integration remains future work (Sections 13--17)."
    },
    {
      "id": "P7",
      "label": "P7: a shock-only baseline cannot test flare-associated onset attribution",
      "status": "documented",
      "requirement_ids": ["SCCM-P7-FLARE-ATTRIBUTION"],
      "resolution": "This is a valid limitation, not a defect in the declared shock-only baseline. A future optional impulsive open-field source must have observation-owned location/time support, its own spectrum and provenance, completely separate number/energy ledgers, and no contribution to shock-source efficiency calibration. It must also classify births relative to the moving front and define terminal encounter versus validated transfer/reacceleration while preserving impulsive ancestry and shock-work ledgers without creating a second shock first-passage birth. Mixed-source runs remain attribution sensitivities until independently validated (Sections 10 and 14--17)."
    },
    {
      "id": "P8",
      "label": "P8: the derived inner wind lacks a continuous full-support plausibility envelope",
      "status": "documented",
      "requirement_ids": ["SCCM-R2-WIND-BOUNDS", "SCCM-N2-TWO-ZONE-WIND", "SCCM-P8-WIND-PLAUSIBILITY-ENVELOPE"],
      "resolution": "The review is partly stale: schema 5 already enforces positivity, observed-zone compatibility, one mass-per-flux authority, and pointwise momentum-residual gates. The genuine remaining gap is a continuous event-specific envelope that can detect an interior speed spike or excessive acceleration/deceleration between comparison radii. One future versioned asset contains distinct single-quantity velocity and acceleration channels plus explicit gate pairings; every channel declares its component/frame, topology/selector, full support, units, interpolant, extrema certificate/tolerance, and uncertainty, while the asset binds covariance, provenance, and construction/qualification role. No speed envelope is reused for acceleration, and no universal monotonic-wind rule or undocumented speed cap is introduced (Sections 5 and 14--17)."
    }
  ]
