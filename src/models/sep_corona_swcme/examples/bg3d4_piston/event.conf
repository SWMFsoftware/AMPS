ambient.profile=pfss-parker-isothermal-v1
plasma.gamma_adiabatic=1.6666666666666667
plasma.electron_temperature_k=1000000
plasma.proton_temperature_k=1000000
plasma.alpha_temperature_k=1000000
plasma.alpha_to_proton_number_ratio=0.04
plasma.include_electron_mass=true
regions.sheath_model=per-ray-lagrangian-piston-v1
regions.ejecta_model=vector-potential-material-map-v1
# BG3D-4 radial Lagrangian controls.  These values are part of the immutable
# event fingerprint; tests that refine them resolve a distinct event identity.
bg3d4.initial_cells=80
bg3d4.initial_buffer_m=4000000000
bg3d4.source_table_points=257
bg3d4.trajectory_maximum_step_s=1000
bg3d4.buffer_check_interval_s=600
bg3d4.minimum_buffer_cells=24
bg3d4.append_cells=64
bg3d4.disturbance_threshold=0.0001
bg3d4.cfl=0.2
bg3d4.artificial_viscosity=vnr
bg3d4.quadratic_viscosity=2
bg3d4.linear_viscosity=0
bg3d4.shock_detection_threshold=0.01
bg3d4.well_balanced_sources=on
handoff.evolution=swcme-dbm-constant-wind-v1
handoff.transition_begin_s=100
handoff.transition_end_s=200
handoff.ambient_speed_m_s=400000
handoff.drag_coefficient_per_m=1e-11
numerics.root_tolerance_s=0.001
numerics.maximum_apex_acceleration_m_s2=100000
