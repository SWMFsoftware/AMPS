# BG3D-4 Level-B contact qualification fixture.  history.csv is still the
# separate synthetic Level-A shock/front regression and is not the piston.
run.profile=pfss-parker-piston-sheath-v1
run.coordinate_frame=inertial-hci
run.start_s=0
run.end_s=200000
domain.solar_radius_m=695700000
domain.first_valid_plasma_radius_m=695700000
domain.coverage_radius_m=299195741400
geometry.latitude_rad=0.1
geometry.longitude_rad=-0.2
geometry.lateral_tilt_rad=0.3
geometry.attachment_policy=attached-then-detached
assets.history_file=examples/bg3d1/history.csv
assets.history_sha256=06f55a7bca32d815e12419f8ecabd0874eeb8df6bd83f16c2e1c8448340795e3
assets.ambient_file=examples/bg3d1/ambient.asset
assets.ambient_sha256=b959c0c42eb3c73c26331cee29e4f615f617ba11aa7e2456e7189257b3a10b3c
assets.ejecta_reference_file=examples/bg3d1/ejecta.asset
