! Shared proton field-line build for the spherical Stage 13 campaign.
! Config.pl selects this file once, with -application=sep_stage13.
! The inherited profile supplies the native three-mover callback, the PIC
! global-clock layout and the proton mass/charge used by SEP transport.
! The physical event, observing products and boundary radii are runtime
! decisions in sep_stage13.in, selected by -i FILE -case NAME.
#include input/test/sep_reduced_front__field_line.input

#General
  ! Isolate the case requirement to this build. All ordinary SEP executables
  ! retain their existing startup defaults and all linked test IDs are usable.
  DefineLocation main/sep.dfn _SEP_STAGE13_REQUIRE_NAMED_CASE_ 1
#endGeneral
