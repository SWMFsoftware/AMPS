! Compile-time capability and memory-layout configuration for the generic
! DIM1 3I/ATLAS executable.  This file is selected by
!
!   ./Config.pl -application=i3
!
! because no input/i3.input exists.  It is never a scientific run receipt.
! Physical sources, dates, rates, mesh dimensions/resolution, brightness
! geometry, and numerical run controls are selected at startup with
!
!   ./amps -i i3.in -case CASE
!
! Placeholder values in the application block exist only because the legacy
! compile-time generator validates a complete runnable topology.  The
! executable refuses to run without -i, and CometRuntimeInput replaces every
! placeholder before mesh, block, or particle allocation.

#main

SpeciesList=H,H2,O,OH,H2O,CO,CO2

makefile SOURCES=src
makefile RUNDIR=run

ProjectSourceDirectory=srcHartley2
WorkingSourceDirectory=build
SourceDirectory=src

Prefix=AMPS
DiagnosticStream=screen
OutputDirectory=PT/plots
StdoutErrorLog=on
DebuggerMode=off
ForceRepeatableSimulationPath=on

TimeStepMode=SpeciesLocalTimeStep
ParticleWeightMode=SpeciesLocalParticleWeight
ParticleWeightCorrectionMode=off
LocalTimeStepFluxResampling=on
CouplerMode=off

#endmain

#include species.input

#General
  ! Allocation/layout limits shared by every case in i3.in.
  ReferenceInjectionParticleNumber=114
  RequestedParticleBufferLength=20000000
  MaxMeshRefinmentLevel=30
  EnforceRequestedMeshResolution=on
  BlockCells=8,1,1
  GhostCells=2,0,0
  NastranSurfaceUserData=off

  define _PIC__PARTICLE_COLLISION_MODEL__CROSS_SECTION_ _PIC__PARTICLE_COLLISION_MODEL__CROSS_SECTION__USER_DEFINED_
  define _PIC__PARTICLE_COLLISION_MODEL__MODE_ _PIC_MODE_ON_
#endGeneral

#IDF
  ! Internal rotational storage is a compiled particle/cell layout choice.
  Model=LB
  vtRelaxation=off
  vvRelaxation=off
  rtRelaxation=on
  nRotModes(H2O=3)
  RotZnum(H2O=5)
  TemperatureIndex(H2O,H)=0.5
  TemperatureIndex(H2O,H2)=0.5
  TemperatureIndex(H2O,O)=0.5
  TemperatureIndex(H2O,OH)=0.5
  TemperatureIndex(H2O,H2O)=0.5
  TemperatureIndex(H2O,CO)=0.5
  TemperatureIndex(H2O,CO2)=0.5
#endIDF

#block ../input/hartley2.pl

  RuntimeInputMode=on
  Dimension=1
  Geometry=Spherical

  ! Nonphysical compile-time placeholders.  i3.in is mandatory at runtime.
  HeliocentricDistanceAU=1.0
  CometRandomSeed=1
  SurfaceSource=H2O | UNIFORM | 1.0 | 175.0 | 0.0
  SurfaceSource=CO  | UNIFORM | 1.0 | 175.0 | 0.0
  SurfaceSource=CO2 | UNIFORM | 1.0 | 175.0 | 0.0

  ! The collision-law topology and cited database are common capabilities of
  ! all six I3 cases.  Case-independent sampled-temperature controls live in
  ! i3.in and replace the two placeholder values below.
  PhysicsDatabase=NONE
  NeutralCollision=H2O | CO2 | CONSTANT | 3.4e-19 | Rubin et al. (2011), Table 3
  NeutralCollision=CO  | CO2 | CONSTANT | 3.2e-19 | Rubin et al. (2011), Table 3
  NeutralCollision=CO2 | CO2 | CONSTANT | 3.4e-19 | Rubin et al. (2011), Table 3
  NeutralCollisionCompletion=COMBI1996_CHEMKIN_LORENTZ_HS
  CollisionTemperatureFloor=175.0
  CollisionTemperatureMinimumSampleParticleNumber=1.0

  ! Compile only the reaction topology, law, and recoil energy.  A=0 is a
  ! deliberate placeholder; every selected case must supply a positive A in
  ! i3.in before CometChemistry constructs its runtime lookup index.
  ChemistryReaction=H2O_H_OH | H2O | H + OH | HELIOCENTRIC | 0 | 0 | 0 | 1 | 4.04
  ChemistryReaction=H2O_H2_O | H2O | H2 + O | HELIOCENTRIC | 0 | 0 | 0 | 1 | 3.94
  ChemistryReaction=H2O_2H_O | H2O | 2*H + O | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0.697
  ChemistryReaction=OH_O3P_H | OH | O + H | HELIOCENTRIC | 0 | 0 | 0 | 1 | 1.27
  ChemistryReaction=OH_O1S_H | OH | O + H | HELIOCENTRIC | 0 | 0 | 0 | 1 | 10
  ChemistryReaction=OH_O1D_H | OH | O + H | HELIOCENTRIC | 0 | 0 | 0 | 1 | 7.73
  ChemistryReaction=H2_2H_EXCITED | H2 | 2*H | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0.488
  ChemistryReaction=H2_2H | H2 | 2*H | HELIOCENTRIC | 0 | 0 | 0 | 1 | 8.22
  ChemistryReaction=H2O_OHPLUS_H_ION | H2O | NONE | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0
  ChemistryReaction=H2O_OPLUS_H2_ION | H2O | NONE | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0
  ChemistryReaction=H2O_HPLUS_OH_ION | H2O | NONE | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0
  ChemistryReaction=H2O_ION | H2O | NONE | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0
  ChemistryReaction=OH_ION | OH | NONE | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0
  ChemistryReaction=H2_ION | H2 | NONE | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0
  ChemistryReaction=H2_DISS_ION | H2 | NONE | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0
  ChemistryReaction=H_ION | H | NONE | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0
  ChemistryReaction=O_ION | O | NONE | HELIOCENTRIC | 0 | 0 | 0 | 1 | 0
  ChemistryMode=on
  ChemistryResidualSampling=systematic
  CometDiagnostics=on

  ! Mesh topology placeholders satisfy the compile-time generator only.
  NucleusRadius=1.0
  DomainOuterRadius=2.0
  RadialCellNumber=1
  NucleusSurfaceResolution=1.0

  RadialSimulationMode=on
  RadialCourantNumber=0.25
  RadialInnerBoundaryTemperature=175.0
  RadialSamplingLength=1
  RadialParticleWeightAdaptation=off
  RadialLoadBalanceInterval=1
  RadialMaxIterations=1
  RadialConvergenceTolerance=0.05
  RadialConvergenceWindows=1

  RadialCharacteristicSpeed=H   | 1
  RadialCharacteristicSpeed=H2  | 1
  RadialCharacteristicSpeed=O   | 1
  RadialCharacteristicSpeed=OH  | 1
  RadialCharacteristicSpeed=H2O | 1
  RadialCharacteristicSpeed=CO  | 1
  RadialCharacteristicSpeed=CO2 | 1

  ! Brightness capability is linked by the DIM1 build.  Its grid, geometry,
  ! emission lines, and Doppler conditions are runtime model data.
  BrightnessMode=off
  DustMode=off

#endblock

#end
